## API密钥获取指南

### 火山引擎同传API（VOLC_APPID / VOLC_ACCESS_TOKEN）

1. 注册火山引擎账号：https://www.volcengine.com/
2. 开通「语音技术」服务：https://console.volcengine.com/speech/service/8
3. 创建应用，获取 `APPID` 和 `Access Token`
4. 开通「同声传译」模型并充值

> 💰 参考价格：输入80元/百万token，输出文本80元/百万token，输出音频300元/百万token
> 一场1小时会议约消耗 6-13元（混合模式）

### 豆包文本大模型（ARK_API_KEY / ARK_MODEL_ENDPOINT_ID）

1. 进入火山引擎方舟：https://console.volcengine.com/ark
2. 创建API Key
3. 在线推理 → 创建推理接入点，选择模型（推荐 doubao-pro-32k）
4. 获取接入点ID（ep-开头）

> 💰 会议纪要成本极低，一场会议约0.1-0.3元

