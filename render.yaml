## 快速开始

### 1. 安装依赖

```bash
cd meetlingo-mvp
npm install
```

### 2. 配置API密钥

复制环境变量模板：

```bash
cp .env.example .env
```

编辑 `.env` 文件，填入你的API密钥：

```env
# 火山引擎语音技术（同传API）
# 获取地址：https://console.volcengine.com/speech/service/8
VOLC_APPID=你的APPID
VOLC_ACCESS_TOKEN=你的AccessToken

# 火山引擎方舟（豆包文本大模型，用于会议纪要）
# 获取地址：https://console.volcengine.com/ark
ARK_API_KEY=你的APIKey
ARK_MODEL_ENDPOINT_ID=你的模型接入点ID

# 服务器端口
PORT=3000
```

### 3. 启动服务器

```bash
npm start
```

服务器启动后访问：http://localhost:3000

