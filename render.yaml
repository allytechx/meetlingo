## 常见问题

**Q: 为什么手机上无法使用麦克风？**
A: 麦克风需要HTTPS环境。localhost可以直接用，手机访问需要HTTPS域名。使用ngrok或部署到带HTTPS的服务器。

**Q: 同传延迟大概多少？**
A: 取决于网络和语言，通常2-4秒。S2T字幕模式比S2S语音播报快约1秒。

**Q: 一场会议大概多少钱API费用？**
A: 1小时会议，混合模式（对方S2T+你S2S）约6-13元。纯字幕模式仅2-4元。

**Q: 支持离线使用吗？**
A: 不支持，同传和纪要都需要联网调用云端API。

**Q: 会议数据安全吗？**
A: 会议录音和转录保存在你自己的服务器上，不会上传到第三方（除了调用API时的音频流）。
