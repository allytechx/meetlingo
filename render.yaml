## 使用流程

### 1. 会前设置
- 输入会议名称
- 选择对方语言
- 开启/关闭语音播报
- 输入行业术语（可选）

### 2. 会中操作
- 点击「开始会议」，授权麦克风
- 手机放在桌上，屏幕朝上
- **对方说话时**：点击「对方在说话」，系统显示外语原文+中文译文
- **你说话时**：点击「我在说话」，系统显示中文+外语译文，并自动用外语播报
- 听到重要内容点「标记重点」
- 可随时暂停/静音

### 3. 会后纪要
- 点击「结束」保存会议
- 点击「生成AI纪要」，自动生成：
  - 会议摘要
  - 关键信息（数字/日期/金额/承诺）
  - 待办事项（含负责人和截止时间）
  - 决议与共识
  - 双语完整转录
- 点击「导出记录」下载文本文件

