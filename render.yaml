# 译会 MeetLingo MVP - 面对面会议同传助手

手机扫码即用的网页APP，支持面对面会议实时同传、双语记录、AI会议纪要。

## 功能特性

- 🎙 **实时同传**：支持11种外语 ↔ 中文双向翻译
- 📝 **双语字幕**：原文+译文实时显示
- 🔊 **语音播报**：你说中文，自动用外语播报给对方（支持音色克隆）
- 📋 **会议记录**：全程双语时间轴记录，一键标记重点
- ✨ **AI纪要**：会后自动生成摘要、关键信息、待办事项、决议
- 📚 **行业术语**：自定义术语库，专业翻译不跑偏
- 📱 **扫码即用**：PWA网页应用，无需下载安装

## 支持语言

英语、德语、法语、西班牙语、日语、韩语、俄语、意大利语、葡萄牙语、荷兰语、阿拉伯语

