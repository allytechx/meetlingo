## 手机端使用（扫码即用）

### 方式一：内网穿透（推荐快速测试）

使用 ngrok 或 cpolar 将本地服务暴露到公网：

```bash
# ngrok 示例
ngrok http 3000
```

得到一个 HTTPS 地址（如 `https://xxxx.ngrok.io`），用手机扫码访问。

> ⚠️ 麦克风功能需要 HTTPS 环境，ngrok 免费版提供 HTTPS。

### 方式二：部署到云服务器

1. 将项目上传到云服务器
2. 安装 Node.js 16+
3. `npm install && npm start`
4. 配置 Nginx 反向代理 + HTTPS 证书
5. 手机访问域名即可

### 方式三：添加到主屏幕（像APP一样使用）

在手机浏览器中打开网站后：
- **iPhone**：Safari → 分享 → 添加到主屏幕
- **Android**：Chrome → 菜单 → 添加到主屏幕

之后就可以像普通APP一样从桌面图标打开。

