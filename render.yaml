## 项目结构

```
meetlingo-mvp/
├── server.js              # 后端服务器（WebSocket代理 + REST API）
├── package.json           # 依赖配置
├── .env.example           # 环境变量模板
├── meetings/              # 会议记录存储目录
└── public/
    ├── index.html         # 前端页面
    ├── app.js             # 前端逻辑（录音、同传、UI）
    └── style.css          # 样式
```

---

## 技术栈

- **后端**：Node.js + Express + ws (WebSocket)
- **前端**：原生HTML/CSS/JS + Web Audio API
- **同传API**：火山引擎豆包同声传译大模型2.0
- **纪要LLM**：火山引擎方舟豆包文本大模型
- **音频处理**：16kHz PCM，实时重采样

---

## 已知限制（MVP阶段）

1. **说话人切换为手动**：需要点击按钮切换"对方说话"/"我说话"，自动说话人识别待后续版本
2. **语言切换需重连**：切换说话人时会有1-2秒重连间隙
3. **S2S音色克隆仅8种语言**：中/英/德/法/西/日/葡/印尼，其他语言仅支持S2T字幕模式
4. **远场拾音效果**：手机放在桌上1-2米距离，建议安静环境使用，嘈杂环境建议配蓝牙麦克风
5. **会议纪要需手动触发**：结束会议后点击"生成AI纪要"

